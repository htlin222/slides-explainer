name: build-video

# Cloud builds each changed slug from the committed content.json and publishes a
# GH Release per PDF. The LLM stage already ran locally; there is no AI here.
# Each slug is built by the reusable build-one workflow (sharded compose).

on:
  push:
    branches: [main]
    paths:
      - 'production/**/config/**'
      - 'production/**/ai/**'
      - 'production/index.json'
      - 'pdf/**'
      - 'scripts/**'
      - 'tools/**'
      # NOTE: workflow/Dockerfile changes do NOT auto-rebuild every video;
      # trigger a rebuild deliberately with workflow_dispatch when needed.
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug to build (blank = all buildable)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
      has: ${{ steps.pick.outputs.has }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            T=$(python3 scripts/ci_targets.py --slug "${{ github.event.inputs.slug }}")
          elif [ "${{ github.event_name }}" = "push" ]; then
            T=$(python3 scripts/ci_targets.py --base "${{ github.event.before }}" --head "${{ github.sha }}")
          else
            T=$(python3 scripts/ci_targets.py)
          fi
          echo "targets=$T" >> "$GITHUB_OUTPUT"
          [ "$T" = "[]" ] && echo "has=false" >> "$GITHUB_OUTPUT" || echo "has=true" >> "$GITHUB_OUTPUT"
          echo "targets: $T"

  build:
    needs: discover
    if: needs.discover.outputs.has == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    uses: ./.github/workflows/build-one.yml
    with:
      slug: ${{ matrix.target.slug }}
      pdf: ${{ matrix.target.pdf }}
    permissions:
      contents: write
      packages: read
    secrets: inherit
