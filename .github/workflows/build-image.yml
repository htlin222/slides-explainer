name: build-image

# Builds the CI dependency image and pushes it to GHCR. Run whenever the
# Dockerfile changes (or manually). build-one jobs run inside this image.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/slides-explainer-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
